<html lang="id">

    <link rel="icon" type="image/svg+xml" href="/rafsan.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect & Load Google Fonts (Pindah ke head agar lebih cepat) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ========================= -->
    <!--     SEO META TAGS         -->
    <!-- ========================= -->
    
    <!-- 1. Title: Buat lebih spesifik dengan keahlian Anda -->
    <title>M. Rafsanjani | Frontend Developer Portfolio</title> 
    
    <!-- 2. Description: Ini yang akan muncul di bawah link Google -->
    <meta name="description" content="Portfolio resmi M. Rafsanjani. Jelajahi project, keahlian, dan pengalaman saya dalam membangun website yang interaktif." />
    
    <!-- 3. Author -->
    <meta name="author" content="M. Rafsanjani" />

    <meta property="og:title" content="M. Rafsanjani | Developer Portfolio" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rafsanjani.vercel.app/" />
